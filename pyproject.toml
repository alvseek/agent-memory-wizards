[project]
name = "agent-memory-wizards"
version = "0.1.0"
description = "agent-memory-wizards (hermod-wizards) - the planning and verification cluster (wizard protocols, implement-plan, the QA pipeline, wait-options-coding) and their compile/install tooling, a peer of the agent-memory core, the coding overlay, and the fleet."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Alviandi Widiasto", email = "alviandi@msn.com" }
]
requires-python = ">=3.12"

# This repo ships markdown procedures + the compile/install tooling, not an installable
# package - so it is never built/distributed.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
